# Sijilna CRM -- production container stack.
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Three services on one private network: nginx (`web`) serving static files and
# proxying PHP to `app` (PHP-FPM), and `db` (MySQL 8.4) with a named volume.
#
# Only `web` publishes a port, and it is bound to loopback: Cloudflare Tunnel
# reaches 127.0.0.1:3102 and routes https://crm.mohamedlabs.com to it. Binding
# 0.0.0.0 would expose the CRM to the whole LAN, which is a hard rule on this
# host. Never add a published port to `db` or `app`.
#
# Paths are relative to THIS file (deploy/): `..` is the checkout root, and
# `.env` is deploy/.env -- see deploy/README.md for how it relates to the
# Laravel .env mounted into the app container. No `version:` key: obsolete.
name: sijilna

services:
  db:
    image: mysql:8.4
    container_name: sijilna-db
    # DB_DATABASE, DB_USERNAME, DB_PASSWORD and DB_ROOT_PASSWORD are declared
    # below as ${...} forms, which compose interpolates from deploy/.env. There
    # is deliberately NO env_file here: mounting the whole application
    # environment into the database container would hand MySQL APP_KEY and the
    # first-boot administrator password for no reason. The healthcheck only
    # needs the MYSQL_* names declared here.
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?required}
      MYSQL_USER: ${DB_USERNAME:?required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?required}
    command:
      # Sized for a 4 GB host that must keep ~2.4 GB free for PHP-FPM, nginx
      # and the tunnel: a 128M buffer pool is plenty for a demo dataset and
      # leaves MySQL's own overhead under ~400 MB.
      - --innodb-buffer-pool-size=128M
      - --innodb-log-buffer-size=16M
      - --max-connections=60
    volumes:
      # THE DATA. This named volume is the only copy of every client database;
      # `docker volume prune` and `docker system prune` delete it irreversibly.
      # It is NOT covered by the /opt/homelab restic backup set -- see
      # deploy/README.md -> Backups.
      - sijilna-db-data:/var/lib/mysql
    healthcheck:
      # Pings with the application user, not root: a root-only ping would report
      # healthy while the app's own credentials were still being created.
      # Folded so the single command line stays readable.
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$MYSQL_PASSWORD" mysqladmin -h 127.0.0.1
          -u"$$MYSQL_USER" ping --silent
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  app:
    build:
      # The image needs the whole checkout (composer.json + composer.lock,
      # packages/, public/build); .dockerignore at the repository root decides
      # what is actually sent.
      context: ..
      dockerfile: deploy/docker/php.Dockerfile
    image: sijilna-app:latest
    container_name: sijilna-app
    # The container environment. The first-boot administrator pair
    # (KRAYIN_ADMIN_EMAIL / KRAYIN_ADMIN_PASSWORD) is read from here too; remove
    # them after the first successful boot.
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Laravel's environment file, mounted read-only: the container may read it
      # but nothing inside it can silently rewrite the file (the entrypoint
      # refuses to start with an empty APP_KEY for exactly that reason). The
      # mount target must be a FILE -- if ../.env is missing, Docker creates a
      # directory there and the app cannot boot.
      - ../.env:/var/www/html/.env:ro
      # Uploads, logs, sessions, compiled views and the storage/installed
      # marker. Read-write: this is the container's persistent state, and the
      # marker is what makes the installer run exactly once.
      - ../storage:/var/www/html/storage
    expose:
      - '9000'
    restart: unless-stopped

  web:
    image: nginx:alpine
    container_name: sijilna-web
    ports:
      # Loopback ONLY: the Cloudflare Tunnel connects from this host. Never
      # 0.0.0.0:3102 -- that publishes the CRM to the entire LAN.
      - 127.0.0.1:3102:80
    volumes:
      - ../public:/var/www/html/public:ro
      - ../storage:/var/www/html/storage:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  sijilna-db-data:
    name: sijilna-db-data
