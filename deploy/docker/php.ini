; Sijilna CRM -- production PHP overrides for the php-fpm container.
;
; Installed as /usr/local/etc/php/conf.d/zz-app.ini by deploy/docker/php.Dockerfile.
; The zz- prefix matters: conf.d files load in alphabetical order, so this one is
; applied after the image's own php-production.ini defaults.
;
; Sizing is chosen for the deployment target: one small demo host with a
; MySQL buffer pool of 128 MB (see deploy/README.md -> Memory budget).

; --- Resource limits ---------------------------------------------------------
; 256M is four FPM workers' worth of headroom against a 4 GB machine while still
; covering PDF rendering (mpdf/dompdf) and spreadsheet imports.
memory_limit = 256M

; Attachments and imported CSVs are the large uploads here; nginx is configured
; with the same 64m in deploy/docker/nginx.conf (client_max_body_size) so PHP
; never rejects a body nginx accepted.
upload_max_filesize = 64M
post_max_size = 64M
max_file_uploads = 20

; Long enough for a full PDF/Excel export, short enough to fail before the
; browser or the tunnel times out. deploy/docker/php-fpm.conf sets
; request_terminate_timeout slightly above this so PHP owns the error.
max_execution_time = 120
max_input_time = 120
max_input_vars = 5000

; --- Errors ------------------------------------------------------------------
; Errors go to the container log (docker compose logs app), never to the page:
; a stack trace rendered in a response is an information leak, and payments-style
; pages would be unreadable anyway.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
expose_php = Off

; --- Locale / time -----------------------------------------------------------
; APP_TIMEZONE in .env is the application's timezone; this is PHP's own default
; and must stay UTC so that log timestamps and any strtotime() without a zone are
; comparable across containers.
date.timezone = UTC

; --- Filesystem --------------------------------------------------------------
; Laravel stats thousands of paths per request (autoloader, views, config). The
; image's code never changes without a rebuild, so a warm realpath cache is
; always valid.
realpath_cache_size = 4096k
realpath_cache_ttl = 600

; --- OPcache -----------------------------------------------------------------
; The application code is baked into the image, so file timestamps never change
; under a running container: validate_timestamps=0 removes a stat() per file per
; request. Deploying therefore means `docker compose up -d --build` (see
; deploy/README.md) and not editing files inside a running container.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.fast_shutdown = 0

; --- Sessions ----------------------------------------------------------------
; Laravel persists sessions itself (SESSION_DRIVER=file in .env, under
; storage/framework/sessions). These are only for the rare PHP-native use.
session.gc_maxlifetime = 14400
session.cookie_httponly = 1

; --- Uploads / misc ----------------------------------------------------------
allow_url_fopen = On
; Never announce the internal host name of the FPM container.
cgi.fix_pathinfo = 0
