; Sijilna CRM -- PHP-FPM pool tuning.
;
; Installed as /usr/local/etc/php-fpm.d/zz-pool.conf by
; deploy/docker/php.Dockerfile. php-fpm.conf includes
; /usr/local/etc/php-fpm.d/*.conf in alphabetical order and php-fpm merges
; repeated sections, so this file's [www] values override the image's own
; www.conf and zz-docker.conf settings (both sort before "zz-pool.conf").
;
; Sized for the target host: 4 GB RAM with about 2.4 GB free, shared with a
; MySQL 8.4 container whose buffer pool is capped at 128 MB. Four workers at the
; 256M memory_limit is the ceiling this box can absorb (see deploy/README.md).

[www]
user = www-data
group = www-data

; Re-declared here rather than inherited: zz-docker.conf also sets 9000, and
; deploy/docker/nginx.conf fastcgi_passes to app:9000. Stating it makes the
; contract between the two files visible.
listen = 9000

pm = dynamic
pm.max_children = 4
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2

; Recycle a worker after this many requests: a cheap bound on any per-request
; leak in a long-lived demo instance.
pm.max_requests = 500

; Fires just after php.ini's max_execution_time (120s) so PHP produces its own
; timeout error instead of FPM killing the worker mid-response.
request_terminate_timeout = 130s

; Worker stderr (PHP warnings, fatal errors) into the container log, so
; `docker compose logs app` shows them without exec'ing into the container.
catch_workers_output = yes
decorate_workers_output = no

; Only .php is executable through FPM, whatever nginx is told.
security.limit_extensions = .php
