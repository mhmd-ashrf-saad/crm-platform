# Sijilna CRM -- nginx server block for the web container.
#
# Dropped at /etc/nginx/conf.d/default.conf, replacing the image's default site.
# It is a complete server{} block with no http{} wrapper, because conf.d files are
# included from inside the http{} section of the stock nginx.conf.
#
# Service names come from deploy/docker-compose.yml: `app` is the PHP-FPM
# container, and /var/www/html/{public,storage} are bind-mounted from the host
# checkout into this container read-only.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Laravel's public directory. PHP itself is executed by the `app` container;
    # this container only serves the static files under it.
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # --- Security headers ----------------------------------------------------
    # This container is the only place these can be set: PHP-FPM never sees the
    # response headers nginx returns to the browser, and the application ships no
    # middleware that adds any (no Content-Security-Policy, X-Frame-Options or
    # friends in app/ or packages/). Everything below therefore survives or dies
    # with this file.
    #
    #   nosniff         Chrome/Edge refuse to sniff a .css or .js served with the
    #                   wrong type -- the classic "image upload that is really
    #                   HTML/JS" escalation. Uploads land in storage/app/public
    #                   and are served from public/storage (see below), so this is
    #                   one Content-Type guess away from being exploitable.
    #   SAMEORIGIN      The admin UI has no legitimate cross-origin framing: the
    #                   only iframe in the codebase is in Webkul/Email's
    #                   HtmlFilter deny-list, and web forms are embedded with
    #                   document.write of markup, not an iframe (see
    #                   web_form::settings.web-forms.embed).
    #   Referrer-Policy No URL under /admin (record ids, contact ids, datagrid
    #                   filters) leaks to third parties in the Referer header of
    #                   an outbound link or an <img> in an email preview.
    #   Permissions-Policy  Deny by name, not by assumption: nothing in this
    #                   product uses the camera, the microphone or geolocation.
    #                   Denying them means a future third-party widget cannot ask
    #                   the browser for them either.
    #   HSTS            The Cloudflare Tunnel terminates TLS, so this header is
    #                   written by nginx over plain HTTP and passed through to the
    #                   browser unchanged. 15552000 = 180 days: short enough that a
    #                   misconfigured certificate is recoverable, long enough to
    #                   cover the 90-day certificate renewal cycle twice over.
    #                   No includeSubDomains and no preload -- preload is a one-way
    #                   door into the browser preload list, and this header cannot
    #                   promise every subdomain of the instance host is HTTPS. Do
    #                   not add either without an operator decision (crm-uif owns
    #                   TLS wiring).
    #
    # `always` is not decoration: without it nginx omits these headers on 4xx/5xx,
    # which are exactly the responses an attack probe produces.
    #
    # NO CSP, deliberately. A policy strict enough to be worth having needs
    # 'unsafe-inline' (or a nonce threaded through every view) because the admin UI
    # is built from in-DOM templates: 145 Blade files carry inline <script> blocks
    # and inline on* handlers such as onclick="switchVisibility()". A Vue in-DOM
    # template is compiled by the full runtime build, which needs 'unsafe-eval'; the
    # HTML mail preview renders sanitised third-party markup, the web form preview is
    # document.write'd into a client's own page, and PDFs are served from the same
    # origin. Adding a CSP here without moving all of that behind nonces would
    # white-screen the admin UI in production -- strictly worse than the header that
    # is missing today. What has to change first: extract the inline scripts into
    # built assets, add a nonce to the Blade layouts, and confirm the mail preview,
    # installer, web form and PDF paths under a report-only policy.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=15552000" always;

    # Attachments, CSV imports and PDF templates; keep in step with
    # post_max_size/upload_max_filesize in deploy/docker/php.ini.
    client_max_body_size 64m;
    client_body_buffer_size 128k;

    # The Cloudflare Tunnel terminates TLS and forwards plain HTTP, so this
    # container never sees an HTTPS request. Generated URLs are forced to https
    # by App\Providers\BrandingServiceProvider (APP_FORCE_HTTPS=true), not here.

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # --- Compression ---------------------------------------------------------
    # Managed build assets are already minified; compress the text responses that
    # are not (JSON, HTML, SVG, fonts are served pre-compressed by browsers'
    # support for brotli/woff2 obviating the latter).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # --- Deny dotfiles -------------------------------------------------------
    # The document root cannot reach the checkout's .env (it lives one level up),
    # but a dotfile rule keeps .git/, .well-known-less probes and stray editor
    # droppings from ever being served. /.well-known/ stays reachable.
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --- Health check and quiet endpoints ------------------------------------
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # --- Managed assets ------------------------------------------------------
    # Vite/Laravel build output under public/build, public/admin/build,
    # public/installer/build and public/webform/build. The filenames carry a
    # content hash, so a one-year immutable cache is safe. Kept ahead of the PHP
    # regex: nothing under /build/ is ever executed.
    location ~* ^/(?:[a-z]+/)?build/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # nginx replaces the WHOLE inherited add_header set as soon as a location
        # declares one, so every location in this file that sets Cache-Control has
        # to restate the security headers or those responses lose them silently.
        # Same list as the server block above; keep the two in step.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        try_files $uri =404;
    }

    # --- Uploaded / published files ------------------------------------------
    # Laravel's public disk. `php artisan storage:link` creates
    # public/storage -> ../storage/app/public inside the app container, which is
    # invisible here because public/ is mounted from the host; serving the same
    # directory through an alias is equivalent and does not depend on the host
    # symlink existing.
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        # Restated for the same inheritance reason as /build/ above, and it matters
        # most here: this location serves operator-uploaded files, the one place
        # nosniff is load-bearing.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
    }

    # --- Front controller ----------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --- PHP-FPM -------------------------------------------------------------
    location ~ \.php$ {
        # A missing script must 404 rather than be handed to FPM with a rewritten
        # SCRIPT_FILENAME (which is how PATH_INFO-style upload bugs turn into
        # arbitrary execution).
        try_files $uri =404;

        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;

        # Brings QUERY_STRING, REQUEST_METHOD, SERVER_NAME, CONTENT_TYPE and the
        # rest of the standard set from /etc/nginx/fastcgi_params.
        include fastcgi_params;

        # $realpath_root, not $document_root: the asset mount makes
        # /var/www/html/public a bind mount, and FPM resolves the real path itself.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Passed through for completeness. Laravel only trusts these when the
        # TrustProxies middleware names the proxy, which this fork does not do --
        # APP_FORCE_HTTPS is what actually fixes generated URLs behind the tunnel.
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;

        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 130s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
}
